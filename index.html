<!DOCTYPE html><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤسسة الأنوار الثقافية</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Tahoma,sans-serif;
  background:linear-gradient(160deg,#e9f7f2,#c8e6dc,#f4efe2);
  color:#164c47;
  padding:25px 15px;
}

.container{
  max-width:480px;
  margin:auto;
  text-align:center;
}

.logo{
  width:145px;
  height:145px;
  object-fit:contain;
  display:block;
  margin:10px auto 15px;
  border-radius:50%;
  background:#fff;
  padding:6px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
  border:3px solid #c9a45c;
}

h1{
  margin:8px 0;
  font-size:27px;
  color:#15534d;
}

.subtitle{
  font-size:16px;
  color:#80683d;
  margin-bottom:25px;
}

.social-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.social{
  text-decoration:none;
  color:#fff;
  background:linear-gradient(135deg,#17665e,#238477);
  border:2px solid #c9a45c;
  border-radius:18px;
  padding:18px 10px;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 5px 12px rgba(0,0,0,.12);
  transition:.2s;
}

.social:hover{
  transform:translateY(-3px);
}

.icon{
  display:block;
  font-size:30px;
  margin-bottom:7px;
}

.telegram{
  grid-column:1 / -1;
}

.quote{
  margin-top:30px;
  padding:18px;
  border-top:1px solid #c9a45c;
  border-bottom:1px solid #c9a45c;
  color:#80683d;
  font-size:18px;
  font-weight:bold;
}

.footer{
  margin-top:20px;
  font-size:13px;
  color:#55716c;
}
</style>
</head>

<body>

<div class="container">

  <!-- شعار مؤسسة الأنوار الثقافية -->
  <img src="logo.png"
       class="logo"
       alt="شعار مؤسسة الأنوار الثقافية">

  <h1>مؤسسة الأنوار الثقافية</h1>

  <div class="subtitle">
    جميع حساباتنا للتواصل
  </div>

  <div class="social-grid">

    <a class="social" href="#" target="_blank">
      <span class="icon">♪</span>
      TikTok
    </a>

    <a class="social" href="#" target="_blank">
      <span class="icon">✈</span>
      Telegram
    </a>

    <a class="social" href="#" target="_blank">
      <span class="icon">◎</span>
      Instagram
    </a>

    <a class="social" href="#" target="_blank">
      <span class="icon">◉</span>
      WhatsApp
    </a>

    <a class="social telegram" href="#" target="_blank">
      <span class="icon">f</span>
      Facebook
    </a>

  </div>

  <div class="quote">
    بالعِلم .. تُبنى الأمم
  </div>

  <div class="footer">
    مؤسسة الأنوار الثقافية © 2026
  </div>

</div>

</body>
</html>
